schema_version: understudy.tenant/v1
id: parabank-local
vendor_app: parabank
# PARABANK_PORT is the one setting for the local instance: `make parabank-up` maps
# the container to it and this URL follows it. Default 8080; a machine where 8080
# is taken sets PARABANK_PORT in .env.
base_url: http://localhost:${PARABANK_PORT:-8080}/parabank
sandbox: true
