schema_version: understudy.app_profile/v1
vendor_app: parabank
surface: web
description: >
  Parasoft ParaBank demo banking app (legacy Java EE / Tomcat, server-rendered,
  jsessionid in URLs, AJAX-loaded option lists, no test ids).

# Verified 2026-10-20 (recon in scripts/recon.py, then the page source) against:
#   local:  http://localhost:8089/parabank  (Docker image parasoft/parabank; this
#           machine maps the container's 8080 to host port 8089 via PARABANK_PORT)
#   public: https://parabank.parasoft.com/parabank

login:
  session: parabank.customer
  route: /index.htm
  username_env: PARABANK_USERNAME
  password_env: PARABANK_PASSWORD
  username_field:
    description: The login form's username box
    fingerprint: { tag: input, input_type: text }
    locators:
      - by: css
        value: "input[name='username']"
        stability: medium
        note: "Recon: the box has no accessible name (plain <p> label), so the name attribute is the handle."
  password_field:
    description: The login form's password box
    fingerprint: { tag: input, input_type: password }
    locators:
      - by: css
        value: "input[name='password']"
        stability: medium
        note: "Same as the username box: unnamed in the accessibility tree."
  submit:
    description: The login form's Log In button
    fingerprint: { role: button, name: Log In }
    locators:
      - by: role
        value: { role: button, name: Log In, exact: true }
        stability: high
        note: "Recon 01_index: button \"Log In\"."
      - by: css
        value: "input[value='Log In']"
        stability: medium
        note: "The value attribute is the label."
  # Recon 02_overview: every signed-in page has the left-panel "Log Out" link.
  signed_in: { kind: visible, role: link, name: Log Out }
  # Confirmed on local ParaBank with a wrong password (read-only check).
  rejected: { kind: visible, text: The username and password could not be verified. }

global_states:
  # Recon: a protected page re-renders the login form in place at the same URL.
  # There is no redirect, so only the DOM shows that the session is gone.
  - id: session_expired
    description: The session has expired (the login form is showing)
    when: { kind: visible, role: heading, name: Customer Login }
    handling: reauthenticate
  - id: server_error
    description: The page load failed with a server error (5xx)
    when: { kind: http_status, min: 500, max: 599 }
    handling: transient
  # From the page source: the page script shows this panel when an XHR fails. It is in the DOM,
  # hidden, on every load, so only its visibility counts.
  - id: app_internal_error
    description: The app is showing its internal-error panel
    when: { kind: visible, text: An internal error has occurred and has been logged. }
    handling: transient

interstitials: []

screenshot_masks:
  - "#leftPanel p.smallText" # "Welcome <customer name>"
  - "select#fromAccountId" # the customer's account numbers
  - "#newAccountId"
  - "#accountTable"

recon:
  demo_credentials_verified:
    local: { username: john, works: true }
    public: { username: john, works: true }
  business_error_not_found:
    route: /activity.htm?id=<bogus>
    shows: 'heading "Error!" and "Could not find account #<id>"'
    note: >
      A bad account id is a business outcome on that page, not the generic
      internal-error panel. Belongs to a capability's outcomes, not to global states.
  routes:
    open_account: /openaccount.htm
    activity: /activity.htm
    overview: /overview.htm
  open_account_page:
    heading: Open New Account
    type_select: "select#type, options valued 0/1, labelled CHECKING/SAVINGS (select by label)"
    from_account_select: "select#fromAccountId, AJAX-loaded from GET services_proxy/bank/customers/<id>/accounts"
    submit_button: >
      input[type='button'][value='Open New Account']: a plain button, not a submit. The
      page script POSTs services_proxy/bank/createAccount and then shows the hidden
      #openAccountResult or #openAccountError panel. A nav link of the same name exists
      (role link): locators must separate them by role.
    success_text: Account Opened!
    new_account_id: "#newAccountId, pattern ^\\d+$, sample 13566"
  overview_heading_by_tenant:
    local: Account Overview
    public: Accounts Overview
    note: "Per-tenant label drift. Never a cross-tenant checkpoint string."
  url_conventions:
    jsessionid_in_path: true
    jsessionid_pattern: ";jsessionid=[0-9A-F]+"
